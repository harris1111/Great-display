name: CI

on:
  push:
    branches: [main, ci-check]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (universal)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select newest Xcode
        run: ./Scripts/ci_select_xcode.sh

      - name: Build app
        env:
          ARCHS: arm64 x86_64
          SIGN_IDENTITY: "-"
          VERSION: 0.0.0-ci.${{ github.run_number }}
          BUILD_NUMBER: ${{ github.run_number }}
          REQUIRE_VALID_SIGNATURE: "1"
        run: ./Scripts/build_app.sh release

      - name: Check bundle
        run: |
          lipo -info dist/GreatDisplay.app/Contents/MacOS/GreatDisplay
          plutil -lint dist/GreatDisplay.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 dist/GreatDisplay.app

      # The build alone only proves the app compiles. Running it catches a
      # binary that fails at launch, and checks the command line dispatch.
      - name: Smoke test
        run: |
          APP=dist/GreatDisplay.app/Contents/MacOS/GreatDisplay
          "${APP}" --help
          "${APP}" --probe
          if "${APP}" --no-such-command; then
            echo "::error::an unknown command must exit with a non-zero status"
            exit 1
          fi

      - name: Runtime probes (throwaway)
        run: |
          APP=dist/GreatDisplay.app/Contents/MacOS/GreatDisplay
          ID=$("${APP}" --probe | python3 -c 'import json,sys; print(json.load(sys.stdin)["displays"][0]["id"])')
          echo "display id: ${ID}"
          run() { echo "--- $*"; set +e; "${APP}" "$@"; echo "exit=$?"; set -e; }
          run --rotate "${ID}" 99999999999
          run --rotate "${ID}" 45
          run --stream-test 9223372036854775807 "${ID}"
          run --set-brightness "${ID}" nan
          run --set-brightness "${ID}" 0.5
          run --mirror "${ID}" off
          run --mirror "${ID}"
          run --hdr "${ID}" maybe
          run --ddc-write "${ID}" 0x10 -1
          run --ddc-read "${ID}" zz
          run --ddc-diag
          run --system-colors dark
          run --adjust "${ID}" gamma=abc
          run --adjust "${ID}" gamma=1.1 0.2
          run --audio-output
          run --create-virtual 3000 1 1
          run --create-virtual 10240 2880 1
          run --self-test skip-disconnect

      - name: Package
        env:
          VERSION: 0.0.0-ci.${{ github.run_number }}
        run: ./Scripts/package_release.sh

      - name: Upload build
        uses: actions/upload-artifact@v5
        with:
          name: GreatDisplay-ci-${{ github.run_number }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
          retention-days: 14

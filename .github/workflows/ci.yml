name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (universal)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select newest Xcode
        run: ./Scripts/ci_select_xcode.sh

      - name: Build app
        env:
          ARCHS: arm64 x86_64
          SIGN_IDENTITY: "-"
          VERSION: 0.0.0-ci.${{ github.run_number }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./Scripts/build_app.sh release

      - name: Check bundle
        run: |
          lipo -info dist/GreatDisplay.app/Contents/MacOS/GreatDisplay
          plutil -lint dist/GreatDisplay.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 dist/GreatDisplay.app

      - name: Package
        env:
          VERSION: 0.0.0-ci.${{ github.run_number }}
        run: ./Scripts/package_release.sh

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: GreatDisplay-ci-${{ github.run_number }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
          retention-days: 14

# Groups GitHub's generated release notes by pull request label.
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: New features
      labels: [enhancement, feature]
    - title: Bug fixes
      labels: [bug, fix]
    - title: Display compatibility
      labels: [compatibility]
    - title: Documentation
      labels: [documentation]
    - title: Other changes
      labels: ["*"]
